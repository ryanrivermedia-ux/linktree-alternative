# KARIMO Configuration
# Generated by /karimo:configure
config_version: "2.0"

# Execution Mode: full | fast-track
mode: full

project:
  name: "linktree-alternative"
  runtime: "node"
  framework: "next"
  package_manager: "bun"

commands:
  build: "bun run build"
  lint: "bun run lint"
  test: null
  typecheck: null

boundaries:
  never_touch:
    - "node_modules/**"
    - ".next/**"
    - "out/**"
    - "package-lock.json"
    - ".env*"

  require_review:
    - "package.json"
    - "next.config.ts"
    - "tsconfig.json"

# GitHub Configuration (required for mode: full)
github:
  owner_type: "user"
  owner: "ryanrivermedia-ux"
  repository: "linktree-alternative"
  merge_strategy: "squash"

execution:
  default_model: "sonnet"
  max_parallel: 3
  pre_pr_checks:
    - "build"
    - "lint"

cost:
  escalate_after_failures: 1
  max_attempts: 3

# Review configuration
review:
  enabled: false
  provider: null
  threshold: 5
  max_revision_loops: 3
  none_behavior: manual
  allow_below_threshold_on:
    - future-work-overlap
    - false-positive-factual
  final_merge_gate:
    enabled: true
    verify_deferred_findings: true
  pre_execution_prompt: true

# CD provider configuration
cd:
  provider: none
  status: pending
  configured_at: "2026-04-30T00:00:00Z"
